<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>

        fieldset {
            width: 400px;
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: whitesmoke;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3%;
            background-color: #37007b;
            font-family: Poppins;
        }

        fieldset {
            width: 100%;
            padding: 4%;
            box-sizing: border-box;
        }

        form {
            width: 90%;
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 4%;
            border-radius: 12px;
            box-sizing: border-box;
        }

        .itens {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px; 
        }

        label, p {
            margin-bottom: 5px;
        }

        .opcoes {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type=text], input[type=email], input[type=password], select, textarea {
            width: 100%;
            padding: 7px;
            box-sizing: border-box;
        }

        input[type=submit], input[type=reset] {
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: black;
            background-color: #37007b74;
        }

        input[type=submit]:hover {
            background-color: #37007b74;
        }

        input[type=reset]:hover {
            background-color: #37007b74;
        }

        input[type=date] {
            padding: 4px;
        }

        .botoes {
            display: flex;
            justify-content: center;
            gap: 2%;
        }

        @media (max-width: 600px) {
            .opcoes {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
        
    </style>
</head>
<body>

    <h1>Formulário</h1>

    <form>
        <fieldset>
            <legend><b>Formulário</b></legend>

            <div class="itens">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome">
            </div>

            <div class="itens">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="maria.silva@edu.unifil">
            </div>

            <div class="itens">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
            </div>

            <div class="itens">
                <label for="data">Data de nascimento</label>
                <input type="date" id="data" name="data">
            </div>

            <div class="itens">
                <label for="curso">Cursos da Computação UniFil</label><br>
                <select id="curso" name="curso">
                    <option value="">Selecione</option>
                    <option value="cc">Ciência da Computação</option>
                    <option value="eng">Engenharia de Software</option>
                </select>
            </div>

            <div class="itens">
                <p>Sexo</p>
                <div class="opcoes">
                    <input type="radio" id="feminino" name="sexo" value="feminino">
                    <label for="feminino">Feminino</label>

                    <input type="radio" id="masculino" name="sexo" value="masculino">
                    <label for="masculino">Masculino</label>
                </div>
            </div>

            <div class="itens">
                <p>Quais são seus interesses?</p>
                <div class="opcoes">
                    <input type="checkbox" id="desenvolvimento" name="interesses" value="desenvolvimento">
                    <label for="html">Desenvolvimento Web</label>

                    <input type="checkbox" id="poo" name="interesses" value="poo">
                    <label for="css">POO</label>

                    <input type="checkbox" id="recursividade" name="interesses" value="recursividade">
                    <label for="javascript">Recursividade</label>
                </div>
            </div>

            <div class="itens">
                <label for="comentarios">Comentários</label><br>
                <textarea id="comentarios" name="comentarios" rows="5" cols="40"></textarea>
            </div>

            <div class="itens">
                <label for="foto">Faça o upload da sua foto</label>
                <input type="file" id="foto" name="foto" accept="image/*">
            </div>

            <div class="botoes">
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </div>
        </fieldset>
    </form>
</body>
</html>
